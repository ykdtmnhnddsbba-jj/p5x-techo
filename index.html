<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>P5X攻略手帖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f3f4; --surface:#ffffff; --text:#1d1a1c; --muted:#655c62; --line:#e4dde1;
  --accent:#c8102e; --accent-soft:#fbe7ea; --ok:#2f7d4f; --on:#ffffff;
  --font-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
  --font-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141113; --surface:#1f1a1d; --text:#f1ecef; --muted:#b3a8ae; --line:#3a3036;
    --accent:#ff5c74; --accent-soft:#3a1d24; --ok:#7fd3a0; --on:#141113; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141113; --surface:#1f1a1d; --text:#f1ecef; --muted:#b3a8ae; --line:#3a3036;
  --accent:#ff5c74; --accent-soft:#3a1d24; --ok:#7fd3a0; --on:#141113; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);line-height:1.65}
.wrap{max-width:920px;margin:0 auto;padding:32px 16px 56px}
header h1{font-family:var(--font-display);font-size:1.7rem;margin:0}
header p{margin:2px 0 18px;color:var(--muted);font-size:.9rem}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
nav button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:8px 14px;border-radius:999px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--on)}
section[hidden]{display:none}
h2{font-family:var(--font-display);font-size:1.25rem;margin:0 0 10px}
h3{font-size:1.02rem;margin:18px 0 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.card.hl{border-left:6px solid var(--accent)}
ul.pts{margin:0;padding-left:1.2em} ul.pts li{margin:4px 0}
.muted{color:var(--muted);font-size:.85rem}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th,.tbl td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-size:.8rem;color:var(--muted);font-weight:700}
.scroll{overflow-x:auto}
.ans{font-weight:700;color:var(--accent)}
.stars{color:var(--accent);letter-spacing:1px;white-space:nowrap}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.done td{opacity:.5}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.calc label{display:flex;flex-direction:column;font-size:.85rem;color:var(--muted);gap:4px}
.calc input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}
.result{margin-top:12px;font-size:1rem}
.result b{color:var(--accent)}
a{color:var(--accent)}
footer{margin-top:24px;font-size:.8rem;color:var(--muted)}
.theme{float:right;font:inherit;font-size:.8rem;background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:4px 10px;cursor:pointer}
:focus-visible{outline:3px solid var(--text);outline-offset:2px}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
.chara{display:flex;flex-direction:column;gap:6px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.chara.own{border-color:var(--accent);background:var(--accent-soft)}
.chara .nm{line-height:1.3}
.chara .nm small{color:var(--muted);font-size:.75rem;margin-left:6px}
.seg{display:grid;grid-template-columns:repeat(8,minmax(0,1fr)) auto;gap:3px}
.seg button{font:inherit;font-size:.8rem;min-width:0;min-height:34px;padding:2px 4px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--text);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on);font-weight:700}
.seg button.wpn{padding:2px 8px}
.seg button.wpn[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.seg button:disabled{opacity:.35;cursor:default}
.sync{float:right;margin-right:6px;font:inherit;font-size:.8rem;background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:4px 10px;cursor:pointer}
.sync.ok{color:var(--ok);border-color:var(--ok)} .sync.bad{color:var(--accent);border-color:var(--accent)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:.88rem;display:none;max-width:90vw;z-index:9}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.filters button{font:inherit;font-size:.82rem;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:4px 10px;border-radius:999px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.mineTag{display:inline-block;font-size:.72rem;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--ok);color:var(--on);white-space:nowrap}
.ok{color:var(--ok);font-weight:700}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <button class="theme" id="themeBtn" type="button">表示切替</button>
    <button class="sync" id="syncChip" type="button">☁ Drive連携</button>
    <h1>P5X攻略手帖</h1>
    <p id="updated">ペルソナ5: The Phantom X（日本版）の自分用メモ</p>
  </header>
  <nav role="tablist" id="tabs">
    <button role="tab" data-tab="now" aria-selected="true">いまの結論</button>
    <button role="tab" data-tab="mine" aria-selected="false">手持ち</button>
    <button role="tab" data-tab="synergy" aria-selected="false">シナジー</button>
    <button role="tab" data-tab="future" aria-selected="false">ガチャ計画</button>
    <button role="tab" data-tab="tier" aria-selected="false">Tier・ガチャ・武器</button>
    <button role="tab" data-tab="src" aria-selected="false">資料</button>
  </nav>

  <section id="now"></section>
  <section id="mine" hidden></section>
  <section id="synergy" hidden></section>
  <section id="future" hidden></section>
  <section id="tier" hidden></section>
  <section id="src" hidden></section>

  <footer>データは攻略サイトの記事を要約したもの。「予想」「未確認」は確定情報ではありません。手持ち・シナジーのチェック・石メモは、右上の「☁ Drive連携」で Google ドライブの p5x-db.json に保存され、スマホとPCで共有できます。</footer>
  <div id="toast" role="status"></div>
<script src="../portal/lib/techo-google.js"></script>
</main>
<script>
(function(){
  var KEY = 'p5x.v1';
  var state = {};
  try { state = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch(e) { state = {}; }
  state.own = state.own || {};   // {キャラ名: {c: 凸数(0-6), w: 専用★5武器あり}}
  state.syn = state.syn || {};
  state.calc = state.calc || {};
  state.synT = state.synT || {};  // {'shoki.r3': 更新時刻}
  state.calcT = state.calcT || 0;
  function saveLocal(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {} }
  function save(){ saveLocal(); scheduleSync(); }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function stars(n){
    if (n == null) return '<span class="muted">未確認</span>';
    return '<span class="stars" aria-label="' + n + '/5">' + '★★★★★'.slice(0, n) + '<span style="opacity:.3">' + '★★★★★'.slice(n) + '</span></span>';
  }
  function link(u, t){ return '<a href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">' + esc(t || '出典') + '</a>'; }
  function $(id){ return document.getElementById(id); }
  var D = null, lastGold = 0;

  // 手持ちの判定: 「暴走ルーチェ（池波星輝）」のような表記も先頭一致で拾う（長い名前を優先）
  function rosterOf(label){
    var hit = null;
    D.roster.forEach(function(r){ if (label.indexOf(r.name) === 0 && (!hit || r.name.length > hit.name.length)) hit = r; });
    return hit;
  }
  function own(name){ var o = state.own[name]; return o && o.c != null && o.c >= 0 ? o : null; }
  function ownTag(label){
    var r = rosterOf(label); if (!r) return '';
    var o = own(r.name); if (!o) return '';
    return ' <span class="mineTag">所持 ' + (o.c ? o.c + '凸' : '無凸') + (o.w ? '・武器' : '') + '</span>';
  }

  // theme toggle
  if (state.theme) document.documentElement.setAttribute('data-theme', state.theme);
  $('themeBtn').onclick = function(){
    var dark = state.theme ? state.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    state.theme = dark ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', state.theme); save();
  };

  // tabs
  var tabs = document.querySelectorAll('#tabs button');
  function show(id){
    tabs.forEach(function(b){ b.setAttribute('aria-selected', b.dataset.tab === id ? 'true' : 'false'); });
    document.querySelectorAll('main > section').forEach(function(s){ s.hidden = s.id !== id; });
    if (location.hash !== '#' + id) history.replaceState(null, '', '#' + id);
  }
  tabs.forEach(function(b){ b.onclick = function(){ show(b.dataset.tab); }; });
  addEventListener('hashchange', function(){ var h = location.hash.slice(1); if (h && document.querySelector('main > section#' + h)) show(h); });

  fetch('data/p5x.json', {cache:'no-cache'}).then(function(r){ return r.json(); }).then(function(d){
    D = d;
    $('updated').textContent = 'ペルソナ5: The Phantom X（日本版）の自分用メモ ・ 情報は ' + d.updated + ' 時点';
    renderNow(); renderMine(); renderSynergy(); renderFuture(); renderTier(); renderSrc();
    var h0 = location.hash.slice(1);
    if (h0 && document.querySelector('main > section#' + h0)) show(h0);
    gStartup();
  }).catch(function(){
    $('now').innerHTML = '<div class="card">データを読み込めませんでした。</div>';
  });

  // ---------- Google Drive 同期（手帖共通 ../portal/lib/techo-google.js。トークンは全手帖で共有）
  var CLIENT_ID = '568813131190-9pb3hf0f3g3rbiglkq4nbk88g4eltk9p.apps.googleusercontent.com';
  var DRIVE_NAME = 'p5x-db.json';
  var GA = window.TechoGoogle ? TechoGoogle.create({site:'p5x', clientId:function(){ return CLIENT_ID; }}) : null;
  var gMsg = GA ? GA.message() : '共通ファイル（portal/lib/techo-google.js）を読み込めませんでした。Drive同期は使えません';
  var fileId = state.driveFileId || null, syncing = false, syncTimer = null, ready = false;
  var toastT;
  function toast(t, ms){ var e = $('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(function(){ e.style.display = 'none'; }, ms || 2500); }
  function setSync(s){
    var map = {off:['☁ Drive連携',''], need:['☁ 要再接続','bad'], ok:['☁ 同期済み','ok'], dirty:['☁ 未同期…','bad'], busy:['☁ 同期中…',''], bad:['☁ 同期エラー','bad']};
    var m = map[s] || map.off, c = $('syncChip'); c.textContent = m[0]; c.className = 'sync ' + m[1];
  }
  function tokenOk(){ var t = GA && GA.token(); return t && Date.now() < t.e - 60000; }
  function body(){
    return JSON.stringify({_readme:'P5X攻略手帖のデータ。own=手持ち★5（c=凸数 -1は未所持, w=専用★5武器, t=更新時刻）、syn=シナジーのチェック、calc=石メモ', schema_version:1, updated_at:new Date().toISOString(),
      own:state.own, plan:state.plan || {}, syn:state.syn, synT:state.synT, calc:state.calc, calcT:state.calcT}, null, 1);
  }
  function mergeRemote(r){
    var changed = false;
    Object.keys(r.own || {}).forEach(function(n){
      var a = state.own[n], b = r.own[n];
      if (b && (!a || (b.t || 0) > (a.t || 0))) { state.own[n] = b; changed = true; }
    });
    Object.keys(r.synT || {}).forEach(function(k){
      if (r.synT[k] > (state.synT[k] || 0)) {
        var p = k.split('.'), v = r.syn && r.syn[p[0]] ? !!r.syn[p[0]][p[1]] : false;
        state.syn[p[0]] = state.syn[p[0]] || {}; state.syn[p[0]][p[1]] = v; state.synT[k] = r.synT[k]; changed = true;
      }
    });
    state.plan = state.plan || {};
    Object.keys(r.plan || {}).forEach(function(n){ var a = state.plan[n], b = r.plan[n]; if (b && (!a || (b.t || 0) > (a.t || 0))) { state.plan[n] = b; changed = true; } });
    if ((r.calcT || 0) > state.calcT) { state.calc = r.calc || {}; state.calcT = r.calcT; changed = true; }
    if (changed) { saveLocal(); if (D) { renderNow(); renderMine(); renderSynergy(); renderFuture(); } }
  }
  function sync(interactive){
    if (syncing || !GA) return Promise.resolve(false);
    if (!tokenOk()) {
      if (interactive) { GA.redirect('', GA.DRIVE); return Promise.resolve(false); }
      setSync('need'); return Promise.resolve(false);
    }
    syncing = true; setSync('busy');
    return GA.syncFile(DRIVE_NAME, fileId, function(remote){ mergeRemote(remote); }, body).then(function(id){
      fileId = state.driveFileId = id; state.driveLinked = true; saveLocal(); setSync('ok'); return true;
    }).catch(function(e){
      if (e && e.forget) { fileId = state.driveFileId = null; saveLocal(); }
      setSync(interactive ? 'bad' : 'need'); if (interactive) toast(e.message, 5000); console.warn(e); return false;
    }).then(function(r){ syncing = false; return r; });
  }
  function scheduleSync(){
    if (!state.driveLinked || !ready) return;
    setSync('dirty'); clearTimeout(syncTimer);
    syncTimer = setTimeout(function(){ if (tokenOk()) sync(false); else setSync('need'); }, 2500);
  }
  $('syncChip').onclick = function(){ sync(true).then(function(ok){ if (ok) toast('Driveと同期しました'); }); };
  addEventListener('pageshow', function(e){ if (e.persisted) { syncing = false; if (state.driveLinked) sync(false); } });
  function gStartup(){
    ready = true;
    if (gMsg) { var m = gMsg; gMsg = ''; setTimeout(function(){ toast(m, 6000); }, 400); }
    if (!GA) return;
    if (tokenOk()) { state.driveLinked = true; sync(false); return; }   // 他の手帖でログイン済みならそのまま使う
    if (!state.driveLinked) return;
    if (!GA.silentOk()) { setSync('need'); return; }
    GA.redirect('none', GA.DRIVE);
  }

  // ---------- いまの結論
  function renderNow(){
    var d = D, owned = d.roster.filter(function(r){ return own(r.name); }).length;
    var h = '<div class="card hl"><h2>' + esc(d.verdict.title) + '</h2><ul class="pts">';
    d.verdict.points.forEach(function(p){ h += '<li>' + esc(p) + '</li>'; });
    h += '</ul>' + (owned ? '<p class="muted">手持ちの★5：' + owned + '体を登録済み（「手持ち」タブ）。表の緑のタグが所持キャラ。</p>' : '<p class="muted">「手持ち」タブでキャラにチェックすると、各表に所持・凸数が出る。</p>') + '</div>';
    h += '<div class="card"><h2>開催中のガチャ</h2><div class="scroll"><table class="tbl"><thead><tr><th>キャラ</th><th>ロール</th><th>引くべき度</th><th>期限</th><th>ひとこと</th></tr></thead><tbody>';
    d.current.forEach(function(c){
      h += '<tr><td><b>' + esc(c.name) + '</b>' + ownTag(c.name) + '</td><td>' + esc(c.role) + '</td><td>' + stars(c.pull) + '</td><td>' + esc(c.until) + '</td><td>' + esc(c.memo) + ' ' + link(c.src) + '</td></tr>';
    });
    h += '</tbody></table></div><p class="muted">引くべき度は GameWith の評価（2026-11-13〜19更新）。持っているキャラは凸より次の新キャラ優先が基本。</p></div>';

    h += '<div class="card"><h2>石メモ（限定の天井まであと何連？）</h2><div class="calc">' +
      inp('cStone', '自在結晶（石）') + inp('cTicket', 'プラチナチケット（枚）') + inp('cPulled', '今のガチャで引いた回数') +
      '</div><div class="result" id="cOut"></div><p class="muted">限定は110連でピックアップ確定。1連=150石で計算。ゴールドチケット分の石は下の計算の結果も足して表示。</p></div>';

    h += '<div class="card"><h2>ゴールドチケット → 石の計算</h2><div class="calc">' +
      inp('gTicket', 'ゴールドチケット（枚）') +
      inp('gRate1a', '交換：認知の断片Ⅰ 何個で') + inp('gRate1b', '→ 自在結晶 何個') + inp('gCap1', '断片Ⅰで交換できる石の月上限（空欄=上限なし）') +
      inp('gRate2a', '交換：認知の断片Ⅱ 何個で') + inp('gRate2b', '→ 自在結晶 何個') +
      '</div><div class="result" id="gOut"></div><p class="muted">' + esc(d.goldNote) + '</p>' +
      '<p class="muted">1回あたりの目安：★2ペルソナ（93%）で断片Ⅰ×30、★4（6.2%）は全員完凸済みなので断片Ⅱ×15、被った★5（0.8%）は完凸前として断片Ⅱ×30＋認知結晶。恒常★5は80連で確定。</p></div>';
    $('now').innerHTML = h;
    ['cStone','cTicket','cPulled','gTicket','gRate1a','gRate1b','gCap1','gRate2a','gRate2b'].forEach(function(id){
      var el = $(id); el.value = state.calc[id] != null ? state.calc[id] : '';
      el.oninput = function(){ state.calc[id] = el.value; state.calcT = Date.now(); save(); calc(); if ($("planBody")) renderFuture(); };
    });
    calc();
  }
  function inp(id, label){ return '<label>' + esc(label) + '<input id="' + id + '" type="number" min="0" inputmode="numeric"></label>'; }
  function num(id){ var v = parseFloat(state.calc[id]); return isFinite(v) && v >= 0 ? v : 0; }
  function calc(){
    // ゴールドチケット
    var t = num('gTicket');
    var f1 = Math.round(t * 0.93 * 30), f2 = Math.round(t * (0.062 * 15 + 0.008 * 30))   // ★4は全員完凸（断片Ⅱ×15）、★5は完凸前（×30）;
    var s5 = Math.max(Math.floor(t / 80), Math.round(t * 0.008));
    var g = 0, parts = [];
    if (num('gRate1a') && num('gRate1b')) {
      var s1 = Math.floor(f1 / num('gRate1a')) * num('gRate1b');
      if (num('gCap1') && s1 > num('gCap1')) { parts.push('断片Ⅰ→石は今月 ' + num('gCap1').toLocaleString() + '石まで（残りの断片Ⅰは来月以降）'); s1 = num('gCap1'); }
      g += s1;
    }
    if (num('gRate2a') && num('gRate2b')) g += Math.floor(f2 / num('gRate2a')) * num('gRate2b');
    var rated = (num('gRate1a') && num('gRate1b')) || (num('gRate2a') && num('gRate2b'));
    $('gOut').innerHTML = t ? ('ゴールドチケット <b>' + t + '枚</b> を引くと、目安で 認知の断片Ⅰ <b>約' + f1.toLocaleString() + '個</b>・断片Ⅱ <b>約' + f2.toLocaleString() + '個</b>、恒常★5が <b>' + s5 + '体前後</b>。<br>' +
      (rated ? '→ 石に換えると <b>約' + Math.floor(g).toLocaleString() + '石</b>（限定 <b>' + Math.floor(g / 150) + '連</b>分）' : '→ 交換レートを入れると石の数が出る') +
      (parts.length ? '<br><span class="muted">' + esc(parts.join('／')) + '</span>' : '')) : 'ゴールドチケットの枚数を入れてね。';
    // 限定の天井
    var bonus = Math.floor(g); lastGold = g;
    var s = num('cStone') + bonus, tk = num('cTicket'), p = num('cPulled');
    var have = Math.floor(s / 150) + tk, need = Math.max(0, 110 - p);
    $('cOut').innerHTML = '手持ちで <b>' + have + '連</b>' + (bonus ? '（ゴールドチケット分 ' + Math.floor(bonus / 150) + '連 を含む）' : '') + ' ・ 天井まで <b>' + need + '連</b> → ' +
      (have >= need ? '<b>天井まで届く</b>（' + (have - need) + '連あまる）' : 'あと <b>' + (need - have) + '連</b>（' + ((need - have) * 150).toLocaleString() + '石）足りない');
  }

  // ---------- 手持ち
  var mineFilter = state.mineFilter || 'all';
  function renderMine(){
    var d = D, roles = ['all','own','not'];
    var h = '<div class="card"><h2>手持ちの★5キャラ</h2><p class="muted">数字（0=無凸〜6凸）を押すと所持扱いになる。「―」で未所持に戻す。専用★5武器を持っていたら「武器」を押す。Drive連携していればスマホと共有される。</p>' +
      '<div class="filters" id="mf">' +
      [['all','全員'],['own','所持だけ'],['not','未所持だけ'],['限定','限定'],['恒常','恒常']].map(function(f){ return '<button type="button" data-f="' + f[0] + '" aria-pressed="' + (mineFilter === f[0]) + '">' + f[1] + '</button>'; }).join('') +
      '</div><div class="roster" id="rosterList"></div><p class="muted" id="mineSum"></p><p class="muted">' + esc(d.rosterNote) + '</p></div>';
    $('mine').innerHTML = h;
    $('mf').onclick = function(e){
      var b = e.target.closest('button'); if (!b) return;
      mineFilter = state.mineFilter = b.dataset.f; saveLocal();
      $('mf').querySelectorAll('button').forEach(function(x){ x.setAttribute('aria-pressed', x === b); });
      drawRoster();
    };
    drawRoster();
  }
  function drawRoster(){
    var h = '';
    D.roster.forEach(function(r, i){
      var o = state.own[r.name] || {}, has = o.c != null && o.c >= 0;
      if (mineFilter === 'own' && !has) return;
      if (mineFilter === 'not' && has) return;
      if ((mineFilter === '限定' || mineFilter === '恒常') && r.kind !== mineFilter) return;
      var seg = '<button type="button" data-n="' + i + '" data-c="-1" aria-pressed="' + !has + '" aria-label="' + esc(r.name) + ' 未所持">―</button>';
      for (var c = 0; c <= 6; c++) seg += '<button type="button" data-n="' + i + '" data-c="' + c + '" aria-pressed="' + (has && o.c === c) + '" aria-label="' + esc(r.name) + ' ' + (c ? c + '凸' : '無凸') + '">' + c + '</button>';
      seg += '<button type="button" class="wpn" data-w="' + i + '" aria-pressed="' + !!(has && o.w) + '"' + (has ? '' : ' disabled') + '>武器</button>';
      h += '<div class="chara' + (has ? ' own' : '') + '"><span class="nm"><b>' + esc(r.name) + '</b><small>' + esc((r.real ? r.real + '・' : '') + r.role + '／' + r.elem + '・' + r.kind) + '</small></span>' +
        '<div class="seg">' + seg + '</div></div>';
    });
    $('rosterList').innerHTML = h || '<p class="muted">該当なし</p>';
    $('rosterList').onclick = function(e){
      var b = e.target.closest('button'); if (!b || b.disabled) return;
      if (b.dataset.c != null) {
        var r = D.roster[+b.dataset.n], v = +b.dataset.c, o = state.own[r.name] || {};
        o.c = v; o.t = Date.now(); if (v < 0) o.w = false; state.own[r.name] = o;
      } else if (b.dataset.w != null) {
        var o2 = state.own[D.roster[+b.dataset.w].name]; if (!o2) return;
        o2.w = !o2.w; o2.t = Date.now();
      } else return;
      save(); drawRoster(); renderNow(); renderFuture();
    };
    var n = D.roster.filter(function(r){ return own(r.name); }).length;
    $('mineSum').textContent = '所持 ' + n + ' / ' + D.roster.length + '体';
  }

  // ---------- シナジー
  function renderSynergy(){
    var sh = '';
    D.synergies.forEach(function(s){
      var done = state.syn[s.id] = state.syn[s.id] || {};
      sh += '<div class="card hl"><h2>' + esc(s.name) + '<span class="tag" style="margin-left:8px">' + esc(s.codename) + '</span></h2>' +
        '<p><b>解放条件：</b>' + esc(s.unlock) + '<br><b>必要パラメータ：</b>' + esc(s.param) + '<br><b>優先度：</b>' + esc(s.priority) + '</p>' +
        '<p class="muted">' + esc(s.paramTips) + '</p>' +
        '<h3>必要な魅力レベル</h3><div class="scroll"><table class="tbl"><tr><th>Rank</th>' + s.paramNeeds.map(function(x){ return '<td>' + x[0] + '</td>'; }).join('') + '</tr><tr><th>魅力</th>' + s.paramNeeds.map(function(x){ return '<td>' + x[1] + '</td>'; }).join('') + '</tr></table></div>' +
        '<h3>ランクアップ時の選択肢（正解＝太字）</h3><div class="scroll"><table class="tbl"><thead><tr><th>済</th><th>Rank</th><th>正解</th><th>ほかの選択肢</th></tr></thead><tbody>';
      s.ranks.forEach(function(r){
        var k = 'r' + r[0];
        sh += '<tr class="' + (done[k] ? 'done' : '') + '"><td><input type="checkbox" data-s="' + s.id + '" data-k="' + k + '"' + (done[k] ? ' checked' : '') + ' aria-label="Rank' + r[0] + '済"></td><td>' + r[0] + '</td><td class="ans">' + esc(r[1]) + '</td><td class="muted">' + esc(r[2]) + '</td></tr>';
      });
      sh += '</tbody></table></div><h3>お出かけ（デート）の選択肢</h3><div class="scroll"><table class="tbl"><thead><tr><th>場所</th><th>正解</th><th>もう一方</th></tr></thead><tbody>';
      s.dates.forEach(function(r){ sh += '<tr><td>' + esc(r[0]) + '</td><td class="ans">' + esc(r[1]) + '</td><td class="muted">' + esc(r[2]) + '</td></tr>'; });
      sh += '</tbody></table></div><h3>好きなプレゼント</h3><div class="scroll"><table class="tbl"><thead><tr><th>品物</th><th>好感度</th><th>値段</th><th>買える所</th></tr></thead><tbody>';
      s.gifts.forEach(function(g){ sh += '<tr><td>' + esc(g[0]) + '</td><td>+' + g[1] + '</td><td>' + esc(g[2]) + '</td><td>' + esc(g[3]) + '</td></tr>'; });
      sh += '</tbody></table></div><p class="muted">' + esc(s.giftNote) + '</p>' +
        '<h3>シナジーで解放されるもの</h3><ul class="pts">' + s.bonuses.map(function(b){ return '<li>Rank' + b[0] + '：' + esc(b[1]) + '</li>'; }).join('') + '</ul>' +
        '<p class="muted">出典：' + link(s.source, 'GameWith') + '（' + esc(s.sourceDate) + '更新）</p></div>';
    });
    var syn = $('synergy');
    syn.innerHTML = sh;
    syn.onchange = function(e){
      var cb = e.target; if (!cb.dataset || !cb.dataset.s) return;
      state.syn[cb.dataset.s][cb.dataset.k] = cb.checked; state.synT[cb.dataset.s + '.' + cb.dataset.k] = Date.now(); save();
      cb.closest('tr').className = cb.checked ? 'done' : '';
    };
  }

  // ---------- 今後のキャラ
  function renderFuture(){
    var today = new Date().toISOString().slice(0, 10);
    state.plan = state.plan || {};
    function planned(n){ var p = state.plan[n]; return !!(p && p.on); }
    function has(n){ return own(n) || D.upcoming.some(function(u){ return u.name.indexOf(n) === 0 && planned(u.name); }); }
    var fh = '<div class="card hl"><h2>ガチャ計画（引く予定にチェック）</h2>' +
      '<p class="muted">「引く」にチェックすると、天井（110連＝16,500石）で確保する前提で、その日までに石が足りるかを出す。今の石は「いまの結論」の石メモ（ゴールドチケット分も込み）を使う。</p>' +
      '<div class="calc">' + inp('pIncome', '2週間で貯まる石（目安・自分で入力）') + inp('pPity', '持ち越している限定ガチャの回数') + '</div>' +
      '<div class="scroll"><table class="tbl"><thead><tr><th>引く</th><th>時期</th><th>キャラ</th><th>大陸版Tier</th><th>おすすめ度</th><th>理由</th><th>手持ちと相性</th><th>石</th></tr></thead><tbody id="planBody"></tbody></table></div>' +
      '<p class="muted">' + esc(D.upcomingNote) + '</p></div>';
    $('future').innerHTML = fh;
    ['pIncome','pPity'].forEach(function(id){
      var el = $(id); el.value = state.calc[id] != null ? state.calc[id] : '';
      el.oninput = function(){ state.calc[id] = el.value; state.calcT = Date.now(); save(); drawPlan(); };
    });
    function drawPlan(){
      var base = num('cStone') + Math.floor(lastGold) + num('cTicket') * 150, inc = num('pIncome'), used = 0, carry = num('pPity'), rows = '';
      D.upcoming.forEach(function(u){
        var mates = (u.with || []).filter(has);
        var weak = u.need && !mates.length;
        var p = u.pull == null ? null : (weak ? Math.max(1, u.pull - 2) : u.pull);
        var fit = !(u.with || []).length ? '<span class="muted">―</span>' :
          (mates.length ? '<span class="ok">◎ ' + esc(mates.join('、')) + '</span>' : '<span class="muted">' + esc(u.ifNot || ('相性の良いキャラ（' + u.with.join('、') + '）が未所持')) + '</span>');
        var on = planned(u.name), stone = '';
        if (on) {
          var need = Math.max(0, 110 - carry) * 150; carry = 0; used += need;
          var days = Math.max(0, (new Date(u.date) - new Date(today)) / 86400000);
          var avail = base + inc * days / 14;
          stone = avail >= used ? '<span class="ok">足りる</span><br><span class="muted">残り約' + Math.floor(avail - used).toLocaleString() + '石</span>' : '<span style="color:var(--accent);font-weight:700">' + Math.ceil(used - avail).toLocaleString() + '石不足</span>';
        }
        var ev = u.kind === 'イベント';
        rows += '<tr' + (u.date < today ? ' class="done"' : '') + '><td>' + (ev ? '' : '<input type="checkbox" data-plan="' + esc(u.name) + '"' + (on ? ' checked' : '') + ' aria-label="' + esc(u.name) + 'を引く">') + '</td>' +
          '<td>' + esc(u.date) + '<br><span class="tag">' + esc(u.sure) + '</span></td><td><b>' + esc(u.name) + '</b><br><span class="muted">' + esc(u.kind) + '<br>' + esc(u.role) + '</span></td>' +
          '<td>' + esc(u.tier || '―') + '</td><td>' + stars(p) + '</td><td>' + esc(u.why) + '</td><td>' + fit + '</td><td>' + stone + '</td></tr>';
      });
      $('planBody').innerHTML = rows;
    }
    $('planBody').onchange = function(e){
      var n = e.target.dataset && e.target.dataset.plan; if (!n) return;
      state.plan[n] = {on: e.target.checked, t: Date.now()}; save(); drawPlan();
    };
    drawPlan();
  }

  // ---------- Tier・ガチャ・武器
  function renderTier(){
    var d = D;
    var th = '<div class="card"><h2>最強キャラTier（無凸）</h2><table class="tbl"><tbody>';
    d.tier.rows.forEach(function(r){ th += '<tr><th style="width:9em">' + esc(r[0]) + '</th><td>' + esc(r[1]) + '</td></tr>'; });
    th += '</tbody></table><p class="muted">' + esc(d.tier.note) + ' 出典：' + link(d.tier.src, 'GameWith') + '（' + esc(d.tier.date) + '更新）</p></div>';
    th += '<div class="card"><h2>大陸版の先行Tier（未実装キャラ込み）</h2><table class="tbl"><tbody>';
    (d.tier.lufel || []).forEach(function(r){ th += '<tr><th style="width:5em">' + esc(r[0]) + '</th><td>' + esc(r[1]) + '</td></tr>'; });
    th += '</tbody></table><p class="muted">ルフェルネットの「[ネタバレ] 韓国版」Tier（2026-11-23閲覧）。競争コンテンツ基準・凸なし基準。SN＝スターナイト（P5Dコラボ）。日本の攻略サイトとは評価がずれることがある。' + link("https://lufel.net/jp/tier/", "ルフェルネット") + '</p></div>';
    th += '<div class="card hl"><h2>武器ガチャは引く？ 凸とどっちが先？</h2><ul class="pts">';
    d.weapon.verdict.forEach(function(v){ th += '<li>' + esc(v) + '</li>'; });
    th += '</ul><h3>武器ガチャの仕組み</h3><table class="tbl"><tbody>';
    d.weapon.facts.forEach(function(g){ th += '<tr><th style="width:9em">' + esc(g[0]) + '</th><td>' + esc(g[1]) + '</td></tr>'; });
    th += '</tbody></table><p class="muted">出典：' + d.weapon.src.map(function(s){ return link(s[1], s[0]); }).join('、') + '</p></div>';
    th += '<div class="card"><h2>キャラガチャの仕組み</h2><table class="tbl"><tbody>';
    d.gacha.forEach(function(g){ th += '<tr><th style="width:9em">' + esc(g[0]) + '</th><td>' + esc(g[1]) + '</td></tr>'; });
    th += '</tbody></table></div>';
    $('tier').innerHTML = th;
  }

  function renderSrc(){
    var srh = '<div class="card"><h2>資料</h2><ul class="pts">';
    D.sources.forEach(function(s){ srh += '<li>' + link(s[1], s[0]) + '</li>'; });
    $('src').innerHTML = srh + '</ul></div>';
  }
})();
</script>
</body>
